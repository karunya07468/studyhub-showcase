services:
  - type: web
    name: studyhub-app
    runtime: node
    plan: free
    buildCommand: cd client && npm ci --no-audit --no-fund && npm run build && cd ../server && npm ci --no-audit --no-fund
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.2
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
